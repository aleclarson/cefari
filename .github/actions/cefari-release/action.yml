name: Cefari Release
description: Build, package, optionally sign/notarize, create update artifacts, and upload Cefari app releases.

inputs:
  project-path:
    description: Path to the Cefari project containing cefari.config.ts.
    required: false
    default: "."
  mode:
    description: Release mode. Use release for production artifacts and prerelease for preview artifacts.
    required: false
    default: "release"
  targets:
    description: Informational target platform label for the current runner. Platform fan-out should be handled by the workflow matrix.
    required: false
    default: ""
  cefari-command:
    description: Cefari CLI command or path to execute. Defaults to a cefari binary already available on PATH.
    required: false
    default: "cefari"
  install-cli:
    description: Whether to install the Cefari CLI from npm before running release commands.
    required: false
    default: "false"
  cefari-version:
    description: Version of the cefari npm package to install when install-cli is true.
    required: false
    default: ""
  release-version:
    description: Version advertised in package and update metadata. Defaults to [package].version from cefari.toml.
    required: false
    default: ""
  release-tag:
    description: Git tag to attach release assets to. Defaults to the current ref name when omitted by the implementation.
    required: false
    default: ""
  release-name:
    description: Human-readable GitHub release name.
    required: false
    default: ""
  create-github-release:
    description: Whether the action should create or update the GitHub release.
    required: false
    default: "false"
  upload-artifacts:
    description: Whether packaged release assets should be uploaded to GitHub Actions artifacts.
    required: false
    default: "true"
  dry-run:
    description: Print the release plan and validate inputs without running build, package, signing, release, or upload commands.
    required: false
    default: "false"
  artifact-name:
    description: GitHub Actions artifact name prefix.
    required: false
    default: "cefari-release"
  signing-platform:
    description: Signing platform passed to cefari package sign when signing is enabled.
    required: false
    default: ""
  signing-config:
    description: Optional path to sign.toml for cargo-codesign.
    required: false
    default: ""
  notarize:
    description: Whether macOS notarization should run after signing.
    required: false
    default: "false"
  update-url-base:
    description: Public download URL prefix used when generating update metadata.
    required: false
    default: ""
  update-target:
    description: Updater target key. Required when update-url-base is set.
    required: false
    default: ""
  update-format:
    description: Updater package format. Defaults from update-target when omitted.
    required: false
    default: ""
  update-key-env:
    description: Environment variable name containing the update signing key.
    required: false
    default: "UPDATE_SIGNING_KEY"

outputs:
  package-dir:
    description: Directory containing the prepared package assembly.
    value: ${{ steps.release.outputs.package-dir }}
  update-dir:
    description: Directory containing generated update metadata and signatures when update generation runs.
    value: ${{ steps.release.outputs.update-dir }}
  artifact-dir:
    description: Directory containing upload-ready release artifacts.
    value: ${{ steps.release.outputs.artifact-dir }}
  release-artifacts:
    description: Newline-delimited file listing package artifacts collected for release processing.
    value: ${{ steps.release.outputs.release-artifacts }}
  release-mode:
    description: Effective release mode.
    value: ${{ steps.release.outputs.release-mode }}

runs:
  using: composite
  steps:
    - id: release
      shell: bash
      env:
        CEFARI_PROJECT_PATH: ${{ inputs.project-path }}
        CEFARI_RELEASE_MODE: ${{ inputs.mode }}
        CEFARI_TARGETS: ${{ inputs.targets }}
        CEFARI_COMMAND: ${{ inputs.cefari-command }}
        CEFARI_INSTALL_CLI: ${{ inputs.install-cli }}
        CEFARI_CLI_VERSION: ${{ inputs.cefari-version }}
        CEFARI_RELEASE_VERSION: ${{ inputs.release-version }}
        CEFARI_RELEASE_TAG: ${{ inputs.release-tag }}
        CEFARI_RELEASE_NAME: ${{ inputs.release-name }}
        CEFARI_CREATE_GITHUB_RELEASE: ${{ inputs.create-github-release }}
        CEFARI_UPLOAD_ARTIFACTS: ${{ inputs.upload-artifacts }}
        CEFARI_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        CEFARI_SIGNING_PLATFORM: ${{ inputs.signing-platform }}
        CEFARI_SIGNING_CONFIG: ${{ inputs.signing-config }}
        CEFARI_NOTARIZE: ${{ inputs.notarize }}
        CEFARI_UPDATE_URL_BASE: ${{ inputs.update-url-base }}
        CEFARI_UPDATE_TARGET: ${{ inputs.update-target }}
        CEFARI_UPDATE_FORMAT: ${{ inputs.update-format }}
        CEFARI_UPDATE_KEY_ENV: ${{ inputs.update-key-env }}
        CEFARI_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        "$GITHUB_ACTION_PATH/release.sh"
    - name: Upload Cefari release artifacts
      if: ${{ inputs.upload-artifacts == 'true' && inputs.dry-run != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}-${{ inputs.mode }}
        path: ${{ steps.release.outputs.artifact-dir }}
        if-no-files-found: error
