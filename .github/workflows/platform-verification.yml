name: Platform Verification

on:
  workflow_dispatch:
    inputs:
      run_release_package_smoke:
        description: Build and inspect release-profile native packages with downloaded CEF.
        required: true
        type: boolean
        default: true
      run_service_lifecycle_smoke:
        description: Run native service install/start/status/stop/uninstall smoke tests.
        required: true
        type: boolean
        default: true
      windows_service_smoke_program:
        description: Optional Windows-service-aware fixture path, or leave empty to skip Windows service lifecycle.
        required: false
        type: string
      windows_service_smoke_args:
        description: Optional JSON array of arguments for the Windows service fixture.
        required: false
        type: string

jobs:
  release-package-smoke:
    if: inputs.run_release_package_smoke
    name: Release Package Smoke (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install CEF build tools on macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install CEF build tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install CEF build tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build cefari CLI
        run: npm run --prefix packages/cefari-cli build

      - name: Create verification project
        run: node packages/cefari-cli/dist/bin/cefari.js init .verify/cefari-sample --name "Cefari Platform Verification"

      - name: Build verification project
        run: node packages/cefari-cli/dist/bin/cefari.js build .verify/cefari-sample --release

      - name: Package verification project
        run: node packages/cefari-cli/dist/bin/cefari.js package .verify/cefari-sample --release

      - name: Verify native package payload
        shell: bash
        run: |
          cargo tree -p cefari-desktop -i cefari-core | grep '^cefari-core'
          scripts/extract-native-package-payload.sh .verify/cefari-sample/dist/package/output .verify/package-inspect
          ruby scripts/verify-native-package-payload.rb .verify/package-inspect "$RUNNER_OS"

      - name: Upload inspected package payload
        uses: actions/upload-artifact@v4
        with:
          name: release-package-smoke-${{ matrix.target.name }}
          path: .verify/package-inspect
          if-no-files-found: error

  service-lifecycle-smoke:
    if: inputs.run_service_lifecycle_smoke
    name: Service Lifecycle Smoke (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WinSW on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CEFARI_SERVICE_SMOKE_APPLICATION: service-smoke-${{ github.run_id }}-${{ matrix.target.name }}
        run: |
          $serviceName = "dev.cefari.$env:CEFARI_SERVICE_SMOKE_APPLICATION"
          $serviceDir = Join-Path $env:ProgramData "service-manager\$serviceName"
          New-Item -ItemType Directory -Force -Path $serviceDir | Out-Null
          $winswPath = Join-Path $serviceDir "$serviceName.exe"
          Invoke-WebRequest `
            -Uri https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe `
            -OutFile $winswPath
          "WINSW_PATH=$winswPath" >> $env:GITHUB_ENV

      - name: Run native service lifecycle smoke
        shell: bash
        env:
          CEFARI_SERVICE_SMOKE_APPLICATION: service-smoke-${{ github.run_id }}-${{ matrix.target.name }}
          CEFARI_SERVICE_SMOKE_PROGRAM: ${{ runner.os == 'Windows' && inputs.windows_service_smoke_program || '' }}
          CEFARI_SERVICE_SMOKE_ARGS: ${{ runner.os == 'Windows' && inputs.windows_service_smoke_args || '' }}
          CEFARI_KEEP_SERVICE_SMOKE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" && -z "${CEFARI_SERVICE_SMOKE_PROGRAM:-}" ]]; then
            export CEFARI_SERVICE_SMOKE_PROGRAM="${SYSTEMROOT}\\System32\\PING.EXE"
            export CEFARI_SERVICE_SMOKE_ARGS='["-t","127.0.0.1"]'
          elif [[ "$RUNNER_OS" != "Windows" ]]; then
            export CEFARI_SERVICE_SMOKE_PROGRAM="/usr/bin/tail"
            export CEFARI_SERVICE_SMOKE_ARGS='["-f","/dev/null"]'
          fi

          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo env \
              "PATH=$PATH" \
              "CARGO_HOME=$CARGO_HOME" \
              "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              "CARGO_TARGET_DIR=/tmp/cefari-service-smoke-target" \
              "CEFARI_SERVICE_SMOKE_APPLICATION=$CEFARI_SERVICE_SMOKE_APPLICATION" \
              "CEFARI_SERVICE_SMOKE_PROGRAM=$CEFARI_SERVICE_SMOKE_PROGRAM" \
              "CEFARI_SERVICE_SMOKE_ARGS=$CEFARI_SERVICE_SMOKE_ARGS" \
              "CEFARI_SERVICE_SMOKE_LEVEL=system" \
              cargo test -p cefari-core --test service_lifecycle -- --ignored --nocapture
          else
            cargo test -p cefari-core --test service_lifecycle -- --ignored --nocapture
          fi

      - name: Print Windows service fixture logs
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        env:
          CEFARI_SERVICE_SMOKE_APPLICATION: service-smoke-${{ github.run_id }}-${{ matrix.target.name }}
        run: |
          $serviceName = "dev.cefari.$env:CEFARI_SERVICE_SMOKE_APPLICATION"
          $serviceDir = Join-Path $env:ProgramData "service-manager\$serviceName"
          if (Test-Path $serviceDir) {
            Get-ChildItem -Force $serviceDir | Format-List FullName,Length,LastWriteTime
            Get-ChildItem -Force $serviceDir -File |
              Where-Object { $_.Extension -ne '.exe' } |
              ForEach-Object {
                Write-Host "::group::$($_.Name)"
                Get-Content -Raw $_.FullName -ErrorAction Continue
                Write-Host "::endgroup::"
              }
          } else {
            Write-Host "No service directory found at $serviceDir"
          }
