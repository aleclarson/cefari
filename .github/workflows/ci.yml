name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust Workspace
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install CEF build tools
        run: brew install cmake ninja

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Cefari skill docs
        run: scripts/sync-cefari-skill-docs.rb --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Check desktop crate
        run: cargo check -p cefari-desktop

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  packaging-tools:
    name: Packaging Tools
    runs-on: macos-latest

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Install cargo-codesign
        run: cargo install cargo-codesign --version 0.4.2 --locked

      - name: Verify packaging tools
        run: |
          cargo packager --help
          cargo codesign --help

  release-action-validation:
    name: Release Action Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Install TypeScript dependencies
        run: pnpm --dir npm install --frozen-lockfile

      - name: Install Linux desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libxdo-dev shellcheck

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint release action and workflows
        shell: bash
        run: |
          shellcheck .github/actions/cefari-release/release.sh
          actionlint \
            .github/workflows/*.yml \
            templates/vite-react-basic/.github/workflows/release.yml \
            templates/vite-react-basic/.github/workflows/prerelease.yml \
            docs/examples/cefari-release-workflow.yml
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_file(p) }' .github/actions/cefari-release/action.yml

      - name: Validate release action dry run
        shell: bash
        run: |
          mkdir -p .ci
          output_file="$(mktemp)"
          GITHUB_OUTPUT="$output_file" \
          GITHUB_ACTION_PATH="$GITHUB_WORKSPACE/.github/actions/cefari-release" \
          CEFARI_PROJECT_PATH=templates/vite-react-basic \
          CEFARI_RELEASE_MODE=prerelease \
          CEFARI_TARGETS=linux-x86_64 \
          CEFARI_COMMAND=cefari \
          CEFARI_INSTALL_CLI=false \
          CEFARI_RELEASE_VERSION=0.0.0-ci \
          CEFARI_RELEASE_TAG=release-action-ci-dry-run \
          CEFARI_CREATE_GITHUB_RELEASE=false \
          CEFARI_UPLOAD_ARTIFACTS=false \
          CEFARI_DRY_RUN=true \
            .github/actions/cefari-release/release.sh | tee .ci/release-action-dry-run.log

          grep -q 'artifact collection skipped in dry-run' .ci/release-action-dry-run.log
          grep -q -- '--version 0.0.0-ci' .ci/release-action-dry-run.log

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build cefari CLI
        shell: bash
        run: |
          pnpm --dir npm build
          mkdir -p .ci/bin
          cat > .ci/bin/cefari <<'SH'
          #!/usr/bin/env bash
          exec node "$GITHUB_WORKSPACE/npm/dist/bin/cefari.js" "$@"
          SH
          chmod +x .ci/bin/cefari

      - name: Create release action sample
        run: node npm/dist/bin/cefari.js init .ci/release-action-sample --name "Release Action CI"

      - name: Create CEF fixture
        shell: bash
        run: |
          mkdir -p .ci/cef-fixture/locales
          cat > .ci/cef-fixture/archive.json <<'JSON'
          {
            "type": "minimal",
            "name": "cef_binary_148.0.10+gfixture+chromium-148.0.0_linux64_minimal.tar.bz2",
            "sha1": "fixture-sha1"
          }
          JSON
          echo fixture > .ci/cef-fixture/libcef.fixture
          echo fixture > .ci/cef-fixture/locales/en-US.pak

      - name: Run release action package validation
        id: release-action
        uses: ./.github/actions/cefari-release
        with:
          project-path: .ci/release-action-sample
          mode: prerelease
          release-version: 0.0.0-ci
          release-tag: release-action-ci
          targets: linux-x86_64
          cefari-command: ${{ github.workspace }}/.ci/bin/cefari
          install-cli: "false"
          create-github-release: "false"
          upload-artifacts: "true"
          artifact-name: release-action-validation
        env:
          CEFARI_CEF_RESOURCES_DIR: ${{ github.workspace }}/.ci/cef-fixture

      - name: Verify release action outputs
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.release-action.outputs.package-dir }}
          ARTIFACT_DIR: ${{ steps.release-action.outputs.artifact-dir }}
          RELEASE_ARTIFACTS: ${{ steps.release-action.outputs.release-artifacts }}
          RELEASE_MODE: ${{ steps.release-action.outputs.release-mode }}
        run: |
          test "$RELEASE_MODE" = prerelease
          test -d "$PACKAGE_DIR/output"
          test -d "$ARTIFACT_DIR"
          test -f "$RELEASE_ARTIFACTS"
          grep -q . "$RELEASE_ARTIFACTS"
          grep -q 'version = "0.0.0-ci"' "$PACKAGE_DIR/cargo-packager.toml"
          scripts/extract-native-package-payload.sh "$PACKAGE_DIR/output" .ci/release-action-package-inspect
          ruby scripts/verify-native-package-payload.rb \
            .ci/release-action-package-inspect \
            "$RUNNER_OS" \
            "$PACKAGE_DIR/manifest.json"

  service-platform:
    name: Service Helpers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test service helper dispatch
        run: cargo test -p cefari-core services::tests -- --nocapture

  package-assembly:
    name: Package Assembly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.1 --activate

      - name: Install TypeScript dependencies
        run: pnpm --dir npm install --frozen-lockfile

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install macOS desktop build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Windows desktop build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build cefari CLI
        run: pnpm --dir npm build

      - name: Build cefari desktop runtime
        run: cargo build -p cefari-desktop --release

      - name: Assemble CLI distribution
        shell: bash
        run: |
          test -f npm/dist/bin/cefari.js
          node npm/dist/bin/cefari.js --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+'
          mkdir -p .ci/cefari-cli
          cp -R npm/dist .ci/cefari-cli/

      - name: Create sample project
        run: node npm/dist/bin/cefari.js init .ci/cefari-sample --name "CI Package Sample"

      - name: Create CEF fixture
        shell: bash
        run: |
          mkdir -p .ci/cef-fixture
          cat > .ci/cef-fixture/archive.json <<'JSON'
          {
            "type": "minimal",
            "name": "cef_binary_148.0.10+gfixture+chromium-148.0.0_macosarm64_minimal.tar.bz2",
            "sha1": "fixture-sha1"
          }
          JSON
          echo fixture > .ci/cef-fixture/libcef.fixture
          mkdir -p .ci/cef-fixture/locales
          echo fixture > .ci/cef-fixture/locales/en-US.pak

      - name: Build sample project
        run: node npm/dist/bin/cefari.js build .ci/cefari-sample
        env:
          CEFARI_CEF_RESOURCES_DIR: .ci/cef-fixture

      - name: Package sample project metadata
        run: node npm/dist/bin/cefari.js package .ci/cefari-sample

      - name: Verify native package payload
        shell: bash
        run: |
          test -d .ci/cefari-sample/dist/package/output
          scripts/extract-native-package-payload.sh .ci/cefari-sample/dist/package/output .ci/package-inspect
          ruby scripts/verify-native-package-payload.rb \
            .ci/package-inspect \
            "$RUNNER_OS" \
            .ci/cefari-sample/dist/package/manifest.json

      - name: Verify assembled package inputs
        shell: bash
        run: |
          test -f .ci/cefari-sample/build/frontend/index.html
          test -f .ci/cefari-sample/build/daemon/main.ts
          test -f .ci/cefari-sample/build/daemon/ci-package-sample-daemon || test -f .ci/cefari-sample/build/daemon/ci-package-sample-daemon.exe
          test -d .ci/cefari-sample/build/cef/resources
          test -f .ci/cefari-sample/build/cef/resources/archive.json
          test -f .ci/cefari-sample/build/cef/resources/libcef.fixture
          test -f .ci/cefari-sample/build/cef/manifest.json
          test -f .ci/cefari-sample/dist/package/cargo-packager.toml
          test -f .ci/cefari-sample/dist/package/manifest.json
          grep -q "build/cef/resources" .ci/cefari-sample/dist/package/manifest.json

      - name: Verify CLI is distributed separately
        shell: bash
        run: |
          test -f .ci/cefari-cli/dist/bin/cefari.js
          ruby -rjson -e '
            desktop_binary = JSON.parse(File.read(".ci/cefari-sample/dist/package/manifest.json")).fetch("desktop_binary")
            abort "unexpected desktop_binary: #{desktop_binary}" unless desktop_binary.match?(/\Aci-package-sample(\.exe)?\z/)
          '
          if grep -q 'cefari-cli' .ci/cefari-sample/dist/package/manifest.json; then
            exit 1
          fi
          if grep -q 'cefari-cli' .ci/cefari-sample/dist/package/manifest.json; then
            exit 1
          fi

      - name: Assemble npm CLI packages
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            macOS)
              case "$(uname -m)" in
                arm64) npm_target="darwin-arm64" ;;
                x86_64) npm_target="darwin-x64" ;;
                *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              ;;
            Linux)
              npm_target="linux-x64"
              ;;
            Windows)
              npm_target="win32-x64"
              ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          mkdir -p .ci/npm
          pnpm --dir npm pack --pack-destination ../.ci/npm
          echo "CEFARI_NPM_TARGET=$npm_target" >> "$GITHUB_ENV"

      - name: Verify npm CLI package
        shell: bash
        run: |
          pnpm --dir npm check
          pnpm --dir npm test
