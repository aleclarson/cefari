name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust Workspace
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install CEF build tools
        run: brew install cmake ninja

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Cefari skill docs
        run: scripts/sync-cefari-skill-docs.rb --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Check desktop crate
        run: cargo check -p cefari-desktop

      - name: Test workspace
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  packaging-tools:
    name: Packaging Tools
    runs-on: macos-latest

    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Install cargo-codesign
        run: cargo install cargo-codesign --version 0.4.2 --locked

      - name: Verify packaging tools
        run: |
          cargo packager --help
          cargo codesign --help

  service-platform:
    name: Service Helpers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test service helper dispatch
        run: cargo test -p cefari-core services::tests -- --nocapture

  package-assembly:
    name: Package Assembly (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Linux desktop build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install macOS desktop build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Windows desktop build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Build cefari CLI
        run: cargo build -p cefari-cli --release

      - name: Build cefari desktop runtime
        run: cargo build -p cefari-desktop --release

      - name: Assemble CLI distribution
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cli_binary="target/release/cefari.exe"
          else
            cli_binary="target/release/cefari"
          fi

          test -f "$cli_binary"
          "$cli_binary" --version | grep -E '^cefari [0-9]+\.[0-9]+\.[0-9]+'
          mkdir -p .ci/cefari-cli-dist
          cp "$cli_binary" .ci/cefari-cli-dist/

      - name: Create sample project
        run: cargo run -p cefari-cli -- init .ci/cefari-sample --name "CI Package Sample"

      - name: Create CEF fixture
        shell: bash
        run: |
          mkdir -p .ci/cef-fixture
          cat > .ci/cef-fixture/archive.json <<'JSON'
          {
            "type": "minimal",
            "name": "cef_binary_148.0.10+gfixture+chromium-148.0.0_macosarm64_minimal.tar.bz2",
            "sha1": "fixture-sha1"
          }
          JSON
          echo fixture > .ci/cef-fixture/libcef.fixture
          mkdir -p .ci/cef-fixture/locales
          echo fixture > .ci/cef-fixture/locales/en-US.pak

      - name: Build sample project
        run: cargo run -p cefari-cli -- build .ci/cefari-sample
        env:
          CEFARI_CEF_RESOURCES_DIR: .ci/cef-fixture

      - name: Package sample project metadata
        run: cargo run -p cefari-cli -- package .ci/cefari-sample

      - name: Verify native package payload
        shell: bash
        run: |
          test -d .ci/cefari-sample/dist/package/output
          scripts/extract-native-package-payload.sh .ci/cefari-sample/dist/package/output .ci/package-inspect
          ruby scripts/verify-native-package-payload.rb \
            .ci/package-inspect \
            "$RUNNER_OS" \
            .ci/cefari-sample/dist/package/manifest.json

      - name: Verify assembled package inputs
        shell: bash
        run: |
          test -f .ci/cefari-sample/build/frontend/index.html
          test -f .ci/cefari-sample/build/daemon/main.ts
          test -f .ci/cefari-sample/build/daemon/cefari-daemon || test -f .ci/cefari-sample/build/daemon/cefari-daemon.exe
          test -d .ci/cefari-sample/build/cef/resources
          test -f .ci/cefari-sample/build/cef/resources/archive.json
          test -f .ci/cefari-sample/build/cef/resources/libcef.fixture
          test -f .ci/cefari-sample/build/cef/manifest.json
          test -f .ci/cefari-sample/dist/package/cargo-packager.toml
          test -f .ci/cefari-sample/dist/package/manifest.json
          grep -q "build/cef/resources" .ci/cefari-sample/dist/package/manifest.json

      - name: Verify CLI is distributed separately
        shell: bash
        run: |
          test -f .ci/cefari-cli-dist/cefari || test -f .ci/cefari-cli-dist/cefari.exe
          ruby -rjson -e '
            desktop_binary = JSON.parse(File.read(".ci/cefari-sample/dist/package/manifest.json")).fetch("desktop_binary")
            abort "unexpected desktop_binary: #{desktop_binary}" unless desktop_binary.match?(/\Aci-package-sample(\.exe)?\z/)
          '
          if grep -q 'cefari-cli' .ci/cefari-sample/dist/package/manifest.json; then
            exit 1
          fi
          if grep -q 'cefari-cli-dist' .ci/cefari-sample/dist/package/manifest.json; then
            exit 1
          fi

      - name: Assemble npm CLI packages
        shell: bash
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            macOS)
              case "$(uname -m)" in
                arm64) npm_target="darwin-arm64" ;;
                x86_64) npm_target="darwin-x64" ;;
                *) echo "unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              cli_binary="target/release/cefari"
              desktop_binary="target/release/cefari-desktop"
              ;;
            Linux)
              npm_target="linux-x64"
              cli_binary="target/release/cefari"
              desktop_binary="target/release/cefari-desktop"
              ;;
            Windows)
              npm_target="win32-x64"
              cli_binary="target/release/cefari.exe"
              desktop_binary="target/release/cefari-desktop.exe"
              ;;
            *)
              echo "unsupported runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          scripts/assemble-npm-cli-packages.rb --root-only --output .ci/npm
          scripts/assemble-npm-cli-packages.rb \
            --target "$npm_target" \
            --cli-binary "$cli_binary" \
            --desktop-binary "$desktop_binary" \
            --output .ci/npm
          echo "CEFARI_NPM_TARGET=$npm_target" >> "$GITHUB_ENV"

      - name: Verify npm CLI package
        shell: bash
        run: |
          scripts/verify-npm-cli-package.sh \
            .ci/npm/packages/cefari-cli \
            ".ci/npm/packages/cefari-cli-${CEFARI_NPM_TARGET}"
