[workspace]
members = [
    "crates/cefari-core",
    "crates/cefari-desktop",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cefari/cefari"
authors = ["Cefari Contributors"]

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
camino = "1.2.2"
cap-std = "4.0.2"
cargo-packager-resource-resolver = "0.1.2"
cargo-packager-updater = "0.2.3"
cef = "148.4.0"
clap = "4.6.1"
directories = "6.0.0"
download-cef = "2.3.2"
duct = "1.1.1"
muda = "0.19.2"
open = "5.3.5"
png = "0.18.1"
raw-window-handle = "0.6.2"
serde = "1.0.228"
serde_json = "1.0.150"
semver = "1.0.28"
service-manager = "0.11.0"
specta = "2.0.0-rc.25"
specta-serde = "0.0.12"
specta-typescript = "0.0.12"
single-instance = "0.3.3"
tao = "0.35.3"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
tray-icon = "0.24.0"
tokio = "1.52.3"
user-notify = "0.4.2"
xshell = "0.3.0-pre.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
