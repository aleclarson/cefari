name: Prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version.
        required: true
      dry_run:
        description: Validate the release workflow without producing artifacts.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  prerelease:
    name: Preview release (${{ matrix.target.name }})
    runs-on: ${{ matrix.target.os }}
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: macos-aarch64
            os: macos-latest
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Install CEF build tools on macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install CEF build tools on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install CEF build tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          choco install ninja -y

      - name: Install release tools
        run: |
          cargo install cargo-packager --version 0.11.8 --locked
          cargo install cargo-codesign --version 0.4.2 --locked

      - name: Resolve prerelease metadata
        shell: bash
        run: |
          if [[ -z "${{ vars.CEFARI_CLI_VERSION }}" ]]; then
            echo "Set the CEFARI_CLI_VERSION repository variable to the @cefari/cli version used for releases." >&2
            exit 1
          fi

          echo "CEFARI_RELEASE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          echo "CEFARI_RELEASE_TAG=prerelease-${{ inputs.version }}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/cefari-release
        with:
          project-path: templates/vite-react-basic
          mode: prerelease
          release-version: ${{ env.CEFARI_RELEASE_VERSION }}
          release-tag: ${{ env.CEFARI_RELEASE_TAG }}
          targets: ${{ matrix.target.name }}
          install-cli: "true"
          cefari-version: ${{ vars.CEFARI_CLI_VERSION }}
          create-github-release: "true"
          upload-artifacts: "true"
          artifact-name: cefari-prerelease-${{ matrix.target.name }}
          dry-run: ${{ inputs.dry_run }}
          update-url-base: ${{ vars.CEFARI_UPDATE_URL_BASE }}
          update-target: ${{ matrix.target.name }}
          update-key-env: UPDATE_SIGNING_KEY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
