name: Prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Preview version.
        required: true
      dry_run:
        description: Validate the release workflow without producing artifacts.
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  prerelease:
    name: Preview release
    runs-on: macos-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cefari-release
        with:
          project-path: templates/vite-react-basic
          mode: prerelease
          release-version: ${{ inputs.version }}
          release-tag: prerelease-${{ inputs.version }}
          targets: macos-aarch64
          create-github-release: "true"
          upload-artifacts: "true"
          dry-run: ${{ inputs.dry_run }}
          update-url-base: ${{ vars.CEFARI_UPDATE_URL_BASE }}
          update-key-env: UPDATE_SIGNING_KEY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
